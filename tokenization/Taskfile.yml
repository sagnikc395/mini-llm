version: '3'

vars:
  BINARY: tokenizer
  OUTDIR: bin

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build the tokenizer binary
    cmds:
      - go build -o {{.BINARY}} .
    sources:
      - '*.go'
      - go.mod
    generates:
      - '{{.BINARY}}'

  run:
    desc: Run the tokenizer without building a binary
    cmds:
      - go run .

  test:
    desc: Run tests
    cmds:
      - go test -v ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY}}
